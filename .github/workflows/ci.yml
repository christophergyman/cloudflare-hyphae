name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bunx biome check .

  # Validate each Worker's wrangler config the way a real deploy would, without
  # touching Cloudflare. Catches binding, export, and migration mistakes in CI.
  deploy-dry-run:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker: [workers/edge, workers/merge-workflow]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx wrangler deploy --dry-run
        working-directory: ${{ matrix.worker }}
