name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bunx biome check .

  # Validate each Worker the way a real deploy would, without touching
  # Cloudflare. Catches binding, export, asset, and container mistakes in CI.
  # `cf` loads cloudflare.config.ts on Node 22.18+, so Node is installed before
  # Bun runs the workspace install.
  deploy-dry-run:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker: [workers/edge, workers/merge-workflow]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx cf deploy --dry-run
        working-directory: ${{ matrix.worker }}
