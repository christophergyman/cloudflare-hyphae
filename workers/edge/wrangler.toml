name = "hyphae-edge"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Blob content is content-addressed in R2 (ADR-004, ADR-020).
[[r2_buckets]]
binding = "BLOBS"
bucket_name = "hyphae-blobs"

# One Hub (Durable Object) per repo, built on the Agents SDK (ADR-017).
# SQLite-backed storage is used (ADR-019).
[[durable_objects.bindings]]
name = "Hub"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

[vars]
ENVIRONMENT = "development"
