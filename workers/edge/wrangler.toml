name = "hyphae-edge"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Structured logs and traces, visible in the dashboard and `wrangler tail`.
[observability]
enabled = true

# Serve the live view (apps/web/public) from the same Worker. API routes
# (/health, /repos, /blobs, /agents) are handled in code first; everything else
# falls through to these static assets.
[assets]
directory = "../../apps/web/public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Always run the Worker first for API and agent routes so the SPA fallback
# never intercepts WebSocket upgrades or REST calls.
run_worker_first = ["/health", "/repos/*", "/blobs/*", "/blobs", "/agents/*"]

# Blob content is content-addressed in R2 (ADR-004, ADR-020).
[[r2_buckets]]
binding = "BLOBS"
bucket_name = "hyphae-blobs"

# Durable git history (ADR-018). The Workers binding creates and manages
# repos; the Hub commits through isomorphic-git. Passed to the Hub as env.
[[artifacts]]
binding = "ARTIFACTS"
namespace = "default"

# Workers AI for the verified merge (ADR-021). Routed through AI Gateway when
# configured; the Hub's MERGE binding consumes this.
[ai]
binding = "AI"

# One Hub (Durable Object) per repo, built on the Agents SDK (ADR-017).
# SQLite-backed storage is used (ADR-019).
[[durable_objects.bindings]]
name = "Hub"
class_name = "Hub"

# Declarative Durable Object export (preferred over [[migrations]]). This
# creates and migrates the SQLite-backed Hub class on deploy.
[exports.Hub]
type = "durable-object"
storage = "sqlite"

# Top-level vars apply to the default `wrangler deploy`, which targets the live
# Worker, so this is production. Wrangler does not inherit bindings into a named
# environment, so per-environment overrides repeat them (see [env.staging]).
[vars]
ENVIRONMENT = "production"

# The merge model default is DEFAULT_MERGE_MODEL in
# packages/merge-agent/src/model.ts. Set MODEL here only to override it.
# MODEL = "@cf/moonshotai/kimi-k2.7-code"

# Optional AI Gateway id (ADR-021). Leave unset to call Workers AI directly;
# set it to route merge model calls through a gateway.
# AI_GATEWAY_ID = "<gateway-id>"

# Example only: staging is not deployed. Every binding and var must be repeated
# per named environment because wrangler does not inherit them.
# [env.staging.vars]
# ENVIRONMENT = "staging"
# [[env.staging.durable_objects.bindings]]
# name = "Hub"
# class_name = "Hub"
# [env.staging.exports.Hub]
# type = "durable-object"
# storage = "sqlite"
# [[env.staging.r2_buckets]]
# binding = "BLOBS"
# bucket_name = "hyphae-blobs"
